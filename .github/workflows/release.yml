name: release

# Builds the SSH.NET package from the pinned commit of this fork (build.sh) and publishes it as a release, with
# SHA256SUMS.txt and a signed build provenance attestation (built by this workflow, from this branch):
# `gh attestation verify SSH.NET.<version>.nupkg --repo muller-camille/SSH.NET`.
# Runs when build.sh or this workflow change on this branch. A release already published is left untouched: change the
# pinned commit and version in build.sh to publish a new one.
on:
  push:
    branches: [ci]
    paths:
      - build.sh
      - .github/workflows/release.yml
  workflow_dispatch:

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Release to publish
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(bash build.sh --tag)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(bash build.sh --commit)" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $tag is already published: nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: steps.release.outputs.exists == 'false'
        with:
          dotnet-version: 10.0.x

      - name: Build
        if: steps.release.outputs.exists == 'false'
        run: bash build.sh

      - name: Checksums
        if: steps.release.outputs.exists == 'false'
        working-directory: out
        run: sha256sum SSH.NET.*.nupkg SSH.NET.*.snupkg | tee SHA256SUMS.txt

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        if: steps.release.outputs.exists == 'false'
        with:
          subject-path: |
            out/SSH.NET.*.nupkg
            out/SHA256SUMS.txt

      - name: Publish
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          {
            echo "SSH.NET package built from commit $COMMIT of this fork."
            echo
            echo "SHA-256 (SHA256SUMS.txt):"
            echo
            echo '```'
            cat out/SHA256SUMS.txt
            echo '```'
            echo
            echo "Build provenance: \`gh attestation verify <package> --repo $GITHUB_REPOSITORY\`"
          } > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --title "$TAG" --notes-file notes.md out/*
